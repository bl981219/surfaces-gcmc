# config.yaml
# Master configuration for Surface GCMC and Thermodynamics

system:
  elements: ["La", "Fe", "O", "Sr"]
  target_stoichiometry: [16, 27, 81, 11] # LSF bulk stoichiometry
  masses: 
    La: 138.9055
    Fe: 55.847
    O: 15.9994
    Sr: 87.62

thermodynamics:
  temperature: 1073
  temperature_range: [700, 1500]
  bulk_pressure_range: [-30, 20]
  surface_pressure_range: [-12, 12]
  o2_overbinding_correction: 1.186
  m3gnet_o_ref: -6.0897 # m3gnet_o_ref: -5.8366 For 873K
  mu_0_o2: -5.23
  chemical_potentials:
    La: -12.5173
    Fe: -7.9327
    O: -6.3026
    Sr: -6.6074
  
gcmc_settings:
  vasp_cmd: "mpirun -n 8 vasp_gam > vasp.out"
  iterations: 10 # For testing purposes; increase to 1000+ for production runs
  mc_ratio: 0.5
  gcmc_ratio: 0.5
  
  # Z-axis CARTESIAN bounds (in Angstroms) for allowed GCMC/MC moves
  region_gcmc_z: [11.2, 15.2] 
  region_mc_z: [3.5, 15.2]
  
  # Move probabilities (Will be auto-normalized to 1.0 by the script)
  displace_ratio: 0.05
  exchange_ratio: 0.10 # Swaps positions of two existing atoms
  change_ratio: 0.05   # Mutates an atom's identity to a different element
  remove_ratio: 0.40
  insert_ratio: 0.40
  
  gcmc_species: ["O"]                # Elements allowed to be inserted/removed
  change_species: ["La", "Fe", "Sr"] # Elements allowed to mutate their identity
  
  min_distance: 1.0
  vasp_verification_freq: inf

