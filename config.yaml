# config.yaml
# Master configuration for Surface GCMC and Thermodynamics

system:
  elements: ["La", "Fe", "O", "Sr", "Co"]
  target_stoichiometry: [16, 27, 81, 11] # LSCF bulk stoichiometry
  masses: 
    La: 138.9055
    Fe: 55.847
    O: 15.9994
    Sr: 87.62
    Co: 58.9332

thermodynamics:
  temperature: 1073 # For surface_thermo and competing_phases_identifier
  temperature_range: [700, 1500]
  bulk_pressure_range: [-30, 20] # log(P_O2) in atm for bulk phase diagram
  surface_pressure_range: [-12, 12] # log(P_O2) in atm for surface phase diagram
  o2_overbinding_correction: 1.186 # eV per O molecule at temperature for MLIAP
  m3gnet_o_ref: -6.0897 # M3GNet reference energy for O atom at 1073K (use -5.8366 for 873K)
  mu_0_o2: -5.23 # Experimental value for O2 binding energy
  chemical_potentials: # Used for GCMC Metropolis acceptance (eV)
    La: -12.5173
    Fe: -7.9327
    O: -6.3026
    Sr: -6.6074
    Co: -6.3909
  
gcmc_settings:
  vasp_cmd: "mpirun -n 8 vasp_gam > vasp.out"
  iterations: 5000
  mc_ratio: 0.5
  gcmc_ratio: 0.5
  # Z-axis fractional bounds for allowed GCMC/MC moves
  region_gcmc_z: [0.73, 1.0] 
  region_mc_z: [0.23, 1.0]
  # Move probabilities
  displace_ratio: 0.05
  change_ratio: 0.15
  remove_ratio: 0.3
  insert_ratio: 0.3
  gcmc_species: ["O"] # The element(s) allowed to be inserted/removed
  min_distance: 1.0   # Minimum allowed distance (Angstroms) between atoms during moves

# Bulk reference energies (eV/unit) for linear programming
bulk_references:
  La2O3:
    energy: -41.833
    stoich: {La: 2, O: 3}
  La0Sr4Fe2O8:
    energy: -88.295982
    stoich: {Sr: 4, Fe: 2, O: 8}
  La1Sr3Fe2O8:
    energy: -94.561150
    stoich: {La: 1, Sr: 3, Fe: 2, O: 8}
  La2Sr2Fe2O8:
    energy: -100.375595
    stoich: {La: 2, Sr: 2, Fe: 2, O: 8}
  La3Sr1Fe2O8:
    energy: -104.970154
    stoich: {La: 3, Sr: 1, Fe: 2, O: 8}
  Fe:
    energy: -8.40925
    stoich: {Fe: 1}
  FeO:
    energy: -13.24117
    stoich: {Fe: 1, O: 1}
  Fe2O3:
    energy: -33.1208725
    stoich: {Fe: 2, O: 3}
  SrO:
    energy: -12.08075
    stoich: {Sr: 1, O: 1}
  SrO2:
    energy: -17.3102055
    stoich: {Sr: 1, O: 2}
  SFO:
    energy: -31.734716
    stoich: {Sr: 1, Fe: 1, O: 3}
  LFO:
    energy: -37.567883
    stoich: {La: 1, Fe: 1, O: 3}
  ABO3:
    energy: -957.450012
    stoich: {La: 16, Fe: 27, O: 81, Sr: 11}